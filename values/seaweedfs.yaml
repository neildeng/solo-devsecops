global:
  monitoring:
    enabled: true
    gatewayHost: null
    gatewayPort: null
    additionalLabels: {}

master:
  enabled: true
  replicas: 1
  volumeSizeLimitMB: 1000
  data:
    type: "persistentVolumeClaim"
    size: "2Gi"
  logs:
    type: "emptyDir"

  podSecurityContext:
    enabled: true
    runAsUser: 2000
    runAsGroup: 2000
    fsGroup: 2000
    fsGroupChangePolicy: OnRootMismatch

  containerSecurityContext:
    enabled: true
    runAsUser: 2000
    allowPrivilegeEscalation: false

volume:
  enabled: true
  replicas: 1
  index: leveldb
  minFreeSpacePercent: 10

  dataDirs:
    - name: data1
      type: "persistentVolumeClaim"
      size: "10Gi"
      maxVolumes: 40
  idx: {}
  podSecurityContext:
    enabled: true
    runAsUser: 2000
    runAsGroup: 2000
    fsGroup: 2000
    fsGroupChangePolicy: OnRootMismatch
  containerSecurityContext:
    enabled: true
    runAsUser: 2000
    allowPrivilegeEscalation: false

volumes: {}

filer:
  enabled: true
  replicas: 1
  data:
    type: "persistentVolumeClaim"
    size: "10Gi"
  logs:
    type: "emptyDir"
  podSecurityContext:
    enabled: true
    runAsUser: 2000
    runAsGroup: 2000
    fsGroup: 2000
    fsGroupChangePolicy: OnRootMismatch
  containerSecurityContext:
    enabled: true
    runAsUser: 2000
    allowPrivilegeEscalation: false
  s3:
    enabled: true
    enableAuth: true
    existingConfigSecret: seaweedfs-credentials

s3:
  enabled: true
  replicas: 2
  enableAuth: true
  existingConfigSecret: seaweedfs-credentials
  auditLogConfig: {}
  createBuckets:
    - name: loki-chunks
      ttl: 3d
      anonymousRead: false
      versioning: Suspended
  podSecurityContext:
    enabled: true
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 2000
  containerSecurityContext:
    enabled: true
    runAsUser: 2000
    allowPrivilegeEscalation: false
  logs:
    type: "emptyDir"
admin:
  enabled: true
  replicas: 1
  secret:
    existingSecret: "seaweedfs-credentials"
    userKey: "admin_username"
    pwKey: "admin_password"
  data:
    type: "persistentVolumeClaim"
    size: "2Gi"
  logs:
    type: "emptyDir"

worker:
  enabled: true
  replicas: 1  # Scale based on workload
  jobType: "vacuum,volume_balance,s3_lifecycle"
  maxDetect: 1  # Maximum concurrent detection requests
  maxExecute: 4  # Maximum concurrent execution jobs per worker
  workingDir: "/tmp/seaweedfs-worker"
  data:
    type: "emptyDir"
