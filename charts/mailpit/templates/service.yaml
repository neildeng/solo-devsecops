apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailpit.fullname" . }}
  labels:
    {{- include "mailpit.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mailpit.selectorLabels" . | nindent 4 }}
  ports:
    - name: smtp
      port: {{ .Values.smtp.port }}
      targetPort: smtp
      protocol: TCP
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
      protocol: TCP
