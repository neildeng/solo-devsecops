{{- if .Values.networkPolicy.enabled }}
{{- $fullName := include "mailpit.fullname" . }}
{{- $ns := .Release.Namespace }}
# default-deny 同時擋進與出，所以一條連線要放行兩次：
#   (1) 目的端 (mailpit) 的 ingress
#   (2) 來源端 (寄件者) 的 egress
# 只寫一邊的症狀跟完全沒寫一樣 —— i/o timeout，看不出少了哪半邊。
#
# 用 CCNP 而非 vanilla NetworkPolicy 的原因：
# Gateway 轉發進來的流量帶的是 reserved:ingress 身分，不屬於任何 Pod 或
# namespace，只有 Cilium 的 fromEntities 表達得出來。
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: {{ $fullName }}-ingress
  labels:
    {{- include "mailpit.labels" . | nindent 4 }}
spec:
  description: "Allow SMTP from senders and web UI from the Gateway"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: {{ $ns }}
      k8s:app.kubernetes.io/name: {{ include "mailpit.name" . }}
      k8s:app.kubernetes.io/instance: {{ .Release.Name }}
  # 只貢獻允許清單，不讓這份策略自己觸發 default-deny
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    {{- range .Values.networkPolicy.allowedSenderNamespaces }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ . }}
      toPorts:
        - ports:
            - port: "{{ $.Values.smtp.port }}"
              protocol: TCP
    {{- end }}
    {{- if .Values.networkPolicy.allowGatewayIngress }}
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "{{ .Values.ui.port }}"
              protocol: TCP
    {{- end }}
{{- range .Values.networkPolicy.allowedSenderNamespaces }}
---
# 寄件端的 egress。少了這半邊，封包根本送不出來源 Pod
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: {{ $fullName }}-egress-from-{{ . }}
  labels:
    {{- include "mailpit.labels" $ | nindent 4 }}
spec:
  description: "Allow {{ . }} to send mail to mailpit"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: {{ . }}
  enableDefaultDeny:
    ingress: false
    egress: false
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $ns }}
            k8s:app.kubernetes.io/name: {{ include "mailpit.name" $ }}
      toPorts:
        - ports:
            - port: "{{ $.Values.smtp.port }}"
              protocol: TCP
{{- end }}
{{- end }}
