# ---- TCP 串流異常：在本叢集是結構性誤報，不是偵測訊號 ----
#
# 實測 16 分鐘 158 筆 alert 中，111 筆 (70%) 是這類協定異常，
# 而 ET Open 的真實特徵一筆都沒命中。
#
# 兩個成因都與環境有關，不與攻擊有關：
#   1. Cilium native routing 下同節點 Pod 互連不經過 eth0，Suricata
#      只看得到半邊的流 —— 於是「invalid ack」「out of window」必然成立
#   2. veth 上的 GRO/LRO 會把封包重組後才交給 af-packet，序號看起來跳號
#
# 治本的做法是在節點關掉 offload (ethtool -K eth0 gro off lro off)，
# 但那是改節點而非改這個 chart 的事，而且會影響該節點所有流量的效能。
# 在只看得到跨節點流量的前提下，這組規則提供的資訊量趨近於零，直接關掉。
group:stream-events.rules

# ---- HTTP 協定異常：Kubernetes 的正常流量形狀 ----
# 2221034  unrecognized authorization method —— API server 的 Bearer token
# 2221036  excessive header repetition      —— 多值 header 的正常用法
# 2221013  request header invalid
# 其餘 http-events 規則保留。
2221013
2221034
2221036
