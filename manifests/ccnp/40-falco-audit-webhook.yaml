---
# 07 — 放行 API Server 送往 Falco 的 k8s audit webhook
#
# 流量路徑：
#   kube-apiserver (control-plane, hostNetwork)
#     -> 127.0.0.1:30007 (NodePort)
#     -> Falco Pod :9765 (kube-security)
#
# 來源是「節點」不是 Pod，所以 vanilla NetworkPolicy 無法表達，
# 必須用 Cilium 的 fromEntities。
#
# host        = 本節點
# remote-node = 叢集中的其他節點（externalTrafficPolicy: Cluster 時會用到）
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-audit-webhook
spec:
  description: "Allow kube-apiserver to deliver audit events to Falco"
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-security
      k8s:app.kubernetes.io/name: falco
  enableDefaultDeny:
    ingress: false
    egress: false
  ingress:
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9765"
              protocol: TCP
