---
# 20 — 明確拒絕雲端 metadata API
#
# 這是 vanilla NetworkPolicy 完全做不到的事：顯式 deny。
# Cilium 的 deny 規則優先於所有 allow，所以即使日後有人寫了一條
# toEntities: world 的寬鬆放行，這條還是擋得住。
#
# 對應 KOAD S01 (T1190 SSRF -> Metadata)：
# Falco 負責看見，這條負責擋住 —— 偵測與預防的分工。
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-deny-metadata-api
spec:
  description: "Block access to cloud metadata endpoints"
  endpointSelector:
    matchExpressions:
      # Exists 不能省。NotIn 在標籤不存在時也成立，少了這條會把
      # reserved:health / ingress / init 一併選中。
      - key: k8s:io.kubernetes.pod.namespace
        operator: Exists
      - key: k8s:io.kubernetes.pod.namespace
        operator: NotIn
        values: [kube-system]
  # 這兩行不能省。依 CRD 定義，「某方向有規則時 default deny 預設為 true」，
  # 而 egressDeny 算 egress 方向的規則 —— 不明確關掉的話，這條純粹的
  # 拒絕策略會順帶把被選中的端點推進 egress default-deny。
  enableDefaultDeny:
    ingress: false
    egress: false
  egressDeny:
    - toCIDR:
        - 169.254.169.254/32
        - 169.254.170.2/32   # ECS task metadata
