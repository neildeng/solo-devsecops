        {
          "type": "table",
          "title": "來源 → 目的 熱點",
          "description": "同一個來源對多個目的、或短時間內大量命中，就是掃描與橫向移動的形狀。這是 Suricata 在這個生態系裡最獨特的價值 —— Falco 看不到這件事，對它而言那只是某個行程開了幾個 socket。對應的告警規則是 100212（同一來源 60 秒內 25 次）。",
          "datasource": {
            "type": "elasticsearch",
            "uid": "wazuh-alerts"
