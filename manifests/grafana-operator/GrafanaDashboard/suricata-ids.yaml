        },
        {
          "type": "barchart",
          "title": "Top 特徵",
          "description": "命中次數最高的 10 條規則特徵。健康的狀態是這裡看到的多半是環境噪音或自家的煙霧測試；若 ET Open 的特徵衝到前段，那才是要查的事。",
          "datasource": {
            "type": "elasticsearch",
            "uid": "wazuh-alerts"
          },
          "gridPos": {
            "x": 14,
            "y": 4,
            "w": 10,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "elasticsearch",
                "uid": "wazuh-alerts"
              },
              "query": "rule.groups:suricata AND rule.level:>=$minlevel AND data.alert.signature:$sig",
              "alias": "",
              "metrics": [
                {
                  "id": "1",
                  "type": "count"
                }
              ],
              "bucketAggs": [
                {
                  "id": "3",
                  "type": "terms",
                  "field": "data.alert.signature",
                  "settings": {
                    "size": "10",
                    "order": "desc",
                    "orderBy": "_count",
                    "min_doc_count": "1"
                  }
                }
              ],
              "timeField": "@timestamp"
            }
          ],
          "options": {
            "orientation": "horizontal",
            "xTickLabelRotation": 0,
            "legend": {
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
