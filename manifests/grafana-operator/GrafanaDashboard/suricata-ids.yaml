                  "id": "4",
                  "type": "terms",
                  "field": "data.dest_ip",
                  "settings": {
                    "size": "5",
                    "order": "desc",
                    "orderBy": "_count",
                    "min_doc_count": "1"
                  }
                }
              ],
              "timeField": "@timestamp"
            }
          ],
          "options": {
            "showHeader": true,
