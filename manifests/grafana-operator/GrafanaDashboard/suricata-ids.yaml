                "uid": "wazuh-alerts"
              },
              "query": "rule.groups:suricata AND rule.level:>=$minlevel AND data.alert.signature:$sig",
              "alias": "",
              "metrics": [
                {
                  "id": "1",
                  "type": "count"
                }
              ],
              "bucketAggs": [
                {
                  "id": "3",
                  "type": "terms",
                  "field": "data.alert.signature",
                  "settings": {
                    "size": "500",
                    "order": "desc",
                    "orderBy": "_count",
                    "min_doc_count": "1"
                  }
                }
              ],
              "timeField": "@timestamp"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "count"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "不重複來源 IP",
          "description": "區間內出現過的來源位址數。這個數字搭配下方的來源熱點看：少數 IP 製造大量告警是掃描的形狀，大量 IP 各出現一兩次通常是環境噪音。",
          "datasource": {
            "type": "elasticsearch",
            "uid": "wazuh-alerts"
          },
          "gridPos": {
            "x": 16,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "elasticsearch",
                "uid": "wazuh-alerts"
              },
              "query": "rule.groups:suricata AND rule.level:>=$minlevel AND data.alert.signature:$sig",
              "alias": "",
              "metrics": [
                {
                  "id": "1",
                  "type": "count"
                }
              ],
              "bucketAggs": [
                {
                  "id": "3",
                  "type": "terms",
                  "field": "data.src_ip",
                  "settings": {
                    "size": "500",
                    "order": "desc",
                    "orderBy": "_count",
                    "min_doc_count": "1"
                  }
                }
              ],
              "timeField": "@timestamp"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "count"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "eve.json 脈絡事件量",
          "description": "Loki 裡的 Suricata 全量事件（http / dns / tls / ssh / stats）。這格與左邊的「告警總數」是刻意的對照：Loki 收全量供 Threat Hunting，Wazuh 只收需要判斷的 alert。實測 alert 只佔全部事件的 0.75%。不含 flow —— Hubble 已經提供同樣的可視性，那是重複資料。",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "expr": "sum(count_over_time({job=\"integrations/suricata\", component=\"eve\"}[$__range]))",
              "queryType": "instant",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "colorMode": "none",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "告警時序（依 Wazuh 等級）",
          "description": "分色的是 Wazuh 判定的等級而非 Suricata 的 severity。兩者刻意不同：Suricata 說的是「這條規則有多重要」，Wazuh 說的是「在這個叢集的脈絡下這件事有多重要」—— 包含爆發收斂與抑制之後的結果。",
          "datasource": {
            "type": "elasticsearch",
            "uid": "wazuh-alerts"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 14,
            "h": 9
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "elasticsearch",
                "uid": "wazuh-alerts"
              },
              "query": "rule.groups:suricata AND rule.level:>=$minlevel AND data.alert.signature:$sig",
              "alias": "",
              "metrics": [
                {
                  "id": "1",
                  "type": "count"
                }
              ],
              "bucketAggs": [
                {
                  "id": "3",
                  "type": "terms",
                  "field": "rule.level",
                  "settings": {
                    "size": "10",
                    "order": "desc",
                    "orderBy": "_term",
                    "min_doc_count": "1"
                  }
                },
                {
                  "id": "2",
                  "type": "date_histogram",
                  "field": "@timestamp",
                  "settings": {
                    "interval": "auto",
                    "min_doc_count": "0",
                    "trimEdges": "0"
                  }
                }
              ],
              "timeField": "@timestamp"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "custom": {
                "drawStyle": "bars",
                "stacking": {
                  "mode": "normal"
                },
                "fillOpacity": 70,
                "lineWidth": 0,
                "axisSoftMin": 0
